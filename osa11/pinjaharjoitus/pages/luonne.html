    <h1>Kissojen luonne/ persoonallisuus</h1>

<figure>
  <figcaption><strong>Seitsemän persoonallisuus- ja käyttäytymispiirrettä</figcaption></strong>
  <ol>
    <li><strong>Aktiivisuus ja leikkisyys:</strong> Kuinka energinen, leikkisä ja utelias kissa on.</li>
    <li><strong>Pelokkuus:</strong> Miten herkästi kissa pelästyy uusia tilanteita, outoja ääniä tai vieraita.</li>
    <li><strong>Ihmisaggressiivisuus:</strong> Kuinka helposti kissa turvautuu aggressioon ihmisiä kohtaan.</li>
    <li><strong>Ihmissosiaalisuus:</strong> Hakeeko kissa ihmisten seuraa, hellyyttä ja huomiota.</li>
    <li><strong>Kissa-aggressiivisuus:</strong> Miten kissa tulee toimeen muiden talouden kissojen kanssa.</li>
    <li><strong>Hiekkalaatikon helppous:</strong> Kissan siisteys ja tapa käyttää hiekkalaatikkoa oikein.</li>
    <li><strong>Liiallinen hoivaaminen:</strong> Nuoleeko tai rapsuttaako kissa itseään liikaa (stressioireilu).</li>
  </ol>
</figure>
