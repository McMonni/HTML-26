<!DOCTYPE html>
<html lang="fi">
<head>
    <link rel="stylesheet" href="../talukkoharjoitus/css/taulukko.css"
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taulukko divin sisällä</title>
</head>
<body>

    <div class="taulukko">
        <table border="2">
          <caption>Kurssitulokset</caption>
          <thead>
            <tr>
              <th scope="col">Opiskelija</th>
              <th scope="col">Kurssi</th>
              <th scope="col">Arvosana</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Kalle</td>
              <td>Ei tietoa</td>
              <td>3</td>
            </tr>
            <tr>
              <td>Juuso</td>
              <td>Ohjelmoinnin perusteet</td>
              <td>5</td>
            </tr>
            <tr>
              <td>Ville</td>
              <td>Tietokannat ja SQL</td>
              <td>4</td>
            </tr>
            <tr>
              <td>Joni</td>
              <td>Verkkosivujen suunnittelu</td>
              <td>3</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <th scope="row">Yhteenveto</th>   
              <td>Hienosti mennyt!</td>
              <td>Hyväksytty</td>
            </tr>
          </tbody>
        </table>
    </div>

</body>
</html>
